<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linktree</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css"
    />
    <link rel="stylesheet" href="../manutençao/css/fundo+header.css" />
    <link rel="stylesheet" href="../styles/links.css" />
  </head>
  <body>
    <!-- ================= HEADER ================= -->
    <header style="padding-top: 1px; padding-bottom: 1px">
      <div class="header-content">
        <div class="brand">
          <a href="index.html">Daisy Américo</a>
        </div>

        <nav>
          <a href="obras.html">Obras</a>
          <a href="encomende.html">Encomendar</a>
          <a href="sobre.html">Sobre Mim</a>
        </nav>
      </div>
    </header>

    <!-- ================= MAIN ================= -->
    <main class="container linktree">
      <!-- Perfil -->
      <section class="profile">
        <img src="../assets/icon/perfil.jpg" />
        <h1>Daisy Américo</h1>
        <p>Arte Visual</p>
      </section>

      <!-- Links -->
      <section class="links">
        <a href="index.html" class="link-item">🌐 Site oficial</a>
        <a href="https://wa.me/554888320641?text=Olá, Daisy" class="link-item2"
          ><img src="/assets/icon/whatsapp.png" alt="Whatsapp" /><span>
            Whatsapp</span
          ></a
        >
        <a
          href="https://www.instagram.com/daisyamericooficial/"
          class="link-item"
          ><img src="/assets/icon/insta.png" alt="Instagram" /><span>
            Instagram</span
          ></a
        >
        <a
          href="https://www.instagram.com/galeriadaisyamerico/"
          class="link-item"
          ><img src="/assets/icon/insta.png" alt="Instagram" /><span>
            Instagram Galeria</span
          ></a
        >
        <a href="sobre.html" class="link-item">📄 Sobre Mim</a>
      </section>
    </main>
  </body>
</html>
